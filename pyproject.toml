[project]
name = "proyecto-admisiones"
version = "0.1.0"
description = "Supervised regression of graduate-school admission probability (Chance of Admit)"
authors = [
    "Samuel Cardona Ochoa",
]
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "joblib==1.5.3",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pyarrow>=18", # Parquet engine required by the feature pipeline
    "scikit-learn==1.9.0",
    "streamlit==1.62.0",
]

[project.urls]
repository = "https://github.com/elKiruvi/Proyecto-Admisiones"


[dependency-groups]
dev = [
    "pre-commit>=4.6.1", # Code linting and formatting
    "pytest>=9.1.1", # Testing framework
    "pytest-cookies>=0.7.0",
    "pytest-cov>=7.1.0",
    "cruft[pyproject]>=2.16.0",# Automated Cookiecutter template synchronization
    "jupyter>=1.0", # Notebooks execution environment
    "ipykernel>=6.29", # Python kernel for the notebooks
    "matplotlib>=3.10", # EDA and model diagnostics plots
    "seaborn>=0.13", # Statistical visualizations
    "scipy>=1.14", # Statistical tests imported directly by notebooks
    "pandera[pandas]>=0.30.0", # Data validation practice (Unit 9); dev-only, never imported by src/
    "mlflow>=3.12.0", # Experiment tracking practice (Unit 11); dev-only, never imported by src/
]

#

[tool.uv]
package = false
default-groups = [
    "dev",
]

# Temporary vulnerability exclusions for `uv audit` (Issue #49). Each advisory
# ID below was explicitly triaged: a fixed version exists and the upgrade is
# deferred to the follow-up dependency-remediation Issue. See AGENTS.md section 16.
