    "GHSA-r9mr-m37c-5fr3",
    "GHSA-wvpp-8hx9-p66j",
    "PYSEC-2026-3788",
    "GHSA-fjr4-x663-mwxc",
    "GHSA-956x-8gvw-wg5v",
    "GHSA-3rp5-jjmw-4wv2",
    "PYSEC-2026-3785",
    "PYSEC-2026-3787",
    # idna 3.10 (fixed in 3.15)
    "GHSA-65pc-fj4g-8rjx",
    # pygments 2.19.2 (fixed in 2.20.0)
    "GHSA-5239-wwwm-4pmq",
    # requests 2.32.5 (fixed in 2.33.0)
    "GHSA-gc5v-m9x4-r6x2",
    # virtualenv 20.34.0 (fixed in 20.36.1)
    "GHSA-597g-3phw-6986",
