ignore = [
    # click 8.2.1 (fixed in 8.3.3)
    "PYSEC-2026-2132",
    # filelock 3.19.1 (fixed in 3.20.3)
    "GHSA-qmgc-5h2g-mvrw",
    "GHSA-w853-jp5j-5j7f",
    # gitpython 3.1.45 (fixed in 3.1.47-3.1.59)
    "GHSA-3f7w-8rr8-f37f",
    "GHSA-9rj7-rf2p-w77r",
    "GHSA-v87r-6q3f-2j67",
    "GHSA-mv93-w799-cj2w",
    "GHSA-x2qx-6953-8485",
    "GHSA-6p8h-3wgx-97gf",
    "PYSEC-2026-2160",
    "GHSA-4gmw-gg2m-w46p",
    "GHSA-hh9p-6wh2-4mfc",
    "GHSA-rwj8-pgh3-r573",
    "GHSA-jm78-9fvv-mhgr",
    "GHSA-hmq2-w58f-27jc",
    "GHSA-p538-c434-8v24",
    "GHSA-2f96-g7mh-g2hx",
    "GHSA-94p4-4cq8-9g67",
    "GHSA-7545-fcxq-7j24",
